name: build

# Wails bindet die Webview des jeweiligen Systems ein (WebKit, WebView2,
# WebKitGTK) und braucht dafür deren native Bibliotheken. Cross-Compiling
# von einer Maschine aus geht deshalb nicht — jede Plattform baut auf ihrem
# eigenen Runner. Der Go-Kern selbst wäre portabel, die Fensterschicht nicht.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: plxr-macos-arm64
            flags: -platform darwin/arm64
          - os: macos-latest
            name: plxr-macos-amd64
            flags: -platform darwin/amd64
          - os: windows-latest
            name: plxr-windows-amd64
            flags: -platform windows/amd64
          - os: ubuntu-latest
            name: plxr-linux-amd64
            flags: -platform linux/amd64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      # WebKitGTK und die Header, gegen die Wails unter Linux linkt.
      - name: Linux-Abhängigkeiten
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Wails installieren
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Kern prüfen
        run: go vet ./...

      - name: Bauen
        run: wails build -clean ${{ matrix.flags }} -ldflags "-X main.version=${GITHUB_REF_NAME#v}"
        shell: bash

      # Der Updater erwartet genau diese Namen: plxr-<os>-<arch>.zip
      - name: Packen
        shell: bash
        run: |
          cd build/bin
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../../${{ matrix.name }}.zip" ./*
          else
            zip -qry "../../${{ matrix.name }}.zip" ./*
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.zip

  # Auf einen Tag hin eine Veröffentlichung anlegen. Erst dann findet
  # `plxr update` etwas.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefakte
      - name: Veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          files: artefakte/**/*.zip
          generate_release_notes: true

  # Der Kern ohne Fensterschicht muss überall durchkompilieren. Läuft schnell
  # und fängt plattformabhängige Fehler, bevor die langsamen Builds starten.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - run: |
          for t in darwin/arm64 darwin/amd64 windows/amd64 linux/amd64 linux/arm64; do
            echo "--- $t"
            GOOS=${t%/*} GOARCH=${t#*/} go build ./internal/...
          done
